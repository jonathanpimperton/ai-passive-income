name: Auto-merge Claude branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get default branch
        id: default
        run: echo "branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and merge PR
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          DEFAULT="${{ steps.default.outputs.branch }}"

          # Check if there are new commits vs default branch
          if git merge-base --is-ancestor "$BRANCH" "origin/$DEFAULT" 2>/dev/null; then
            echo "Branch is already merged, skipping."
            exit 0
          fi

          # Create PR and merge it
          PR_URL=$(gh pr create \
            --base "$DEFAULT" \
            --head "$BRANCH" \
            --title "Auto-merge: $BRANCH" \
            --body "Automatic merge of Claude Code session branch into $DEFAULT." \
            2>/dev/null || true)

          # If PR already exists, get its URL
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null || true)
          fi

          if [ -n "$PR_URL" ]; then
            gh pr merge "$PR_URL" --merge --auto
            echo "Merged: $PR_URL"
          else
            echo "No PR to merge."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
