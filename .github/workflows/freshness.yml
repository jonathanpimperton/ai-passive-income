# Weekly freshness check (plan-2026-11 PL-9, review RC6). A failed run emails the owner
# (GitHub notifies on failed scheduled runs; see docs/owner-actions-2026-11.md, O-11).
# It fails when a dated fact (tax year, rates, security.txt expiry, ...) is due within
# 30 days or overdue. Needs no secrets and changes nothing.
#
# Note: GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity. The owner runbook covers re-enabling it.
name: Freshness

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Dependency-free scripts: no npm install needed.
      - name: Tax-rates freshness guard
        run: node scripts/check-rates-freshness.mjs

      # scripts/check-facts-calendar.mjs comes from the W1-TAX workstream (it reads
      # docs/freshness-calendar.md). Until that branch is merged the step warns instead of
      # failing; once the script exists, its exit code decides the run.
      - name: Dated-facts calendar
        run: |
          if [ -f scripts/check-facts-calendar.mjs ]; then
            node scripts/check-facts-calendar.mjs
          else
            echo "::warning title=Facts calendar missing::scripts/check-facts-calendar.mjs is not in this commit yet (W1-TAX). Only the rates guard ran."
          fi
