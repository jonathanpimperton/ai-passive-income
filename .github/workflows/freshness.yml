# Weekly freshness check (plan-2026-11 PL-9, review RC6). A failed run emails the owner
# (GitHub notifies on failed scheduled runs; see docs/owner-actions-2026-11.md, O-11).
# It fails when a dated fact (tax year, rates, security.txt expiry, ...) is due, overdue or
# inside its lead time, or when the tax-rates guard fails. Facts coming up within 30 days
# show as warnings on the run without failing it. Needs no secrets and changes nothing.
#
# Note: GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity. The owner runbook covers re-enabling it.
name: Freshness

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Dependency-free scripts: no npm install needed.
      - name: Tax-rates freshness guard
        run: node scripts/check-rates-freshness.mjs

      - name: Dated-facts calendar
        run: node scripts/check-facts-calendar.mjs
