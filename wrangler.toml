name = "calcrun"
compatibility_date = "2025-01-01"
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"
# Unknown URLs get the nearest 404.html (dist/404.html) with status 404. Without this the
# assets layer answered with an empty 404 body (review S1-1). html_handling stays at the
# default, "auto-trailing-slash". Requests that match no asset reach worker.ts, which sends
# every non-/api/ path to env.ASSETS.fetch(), where this setting also applies.
not_found_handling = "404-page"

